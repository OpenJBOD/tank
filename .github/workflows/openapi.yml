name: OpenAPI

on:
  push:
    paths:
      - 'openapi.yaml'
      - 'redocly.yaml'
      - 'src/**'
      - 'scripts/check_openapi_routes.py'
      - '.github/workflows/openapi.yml'
  pull_request:
    paths:
      - 'openapi.yaml'
      - 'redocly.yaml'
      - 'src/**'
      - 'scripts/check_openapi_routes.py'
      - '.github/workflows/openapi.yml'

permissions:
  contents: read

jobs:
  openapi:
    name: Lint spec and check routes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Lint openapi.yaml
        run: npx --yes @redocly/cli@1.34.5 lint openapi.yaml

      - name: Compare spec paths with registered routes
        run: python3 scripts/check_openapi_routes.py
